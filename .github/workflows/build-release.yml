name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  metadata:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      qt: ${{ steps.version.outputs.qt }}
      vcpkg: ${{ steps.version.outputs.vcpkg }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate version and dependency lock
        id: version
        run: python tools/ci/version.py
      - name: Packaging script tests
        run: python -m unittest discover -s tools/ci -p 'test_*.py' -v

  build:
    needs: metadata
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15, target: mac-arm64, qt_host: mac, qt_arch: clang_64}
          - {os: macos-15-intel, target: mac-x64, qt_host: mac, qt_arch: clang_64}
          - {os: windows-2022, target: win-x64, qt_host: windows, qt_arch: win64_msvc2022_64}
          - {os: ubuntu-22.04, target: linux-x64, qt_host: linux, qt_arch: linux_gcc_64}
    defaults:
      run:
        shell: bash
    env:
      PACKAGE_VERSION: ${{ needs.metadata.outputs.version }}
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      QT_QUICK_CONTROLS_STYLE: Basic
      STACKS_TEST_MODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libzip-dev zlib1g-dev patchelf desktop-file-utils libfuse2 \
            libgl1-mesa-dev libegl1 libopengl0 libfontconfig1 libdbus-1-3 libpulse0 libasound2 \
            libxkbcommon-dev libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-shape0 libxcb-randr0 libxcb-xfixes0 \
            libxcb-sync1 libxcb-xkb1 libnss3
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: brew install libzip ninja
      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
      - name: Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VCPKG_COMMIT: ${{ needs.metadata.outputs.vcpkg }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = "$env:RUNNER_TEMP/stacks-vcpkg"
          git init $root
          git -C $root remote add origin https://github.com/microsoft/vcpkg.git
          git -C $root fetch --depth 1 origin $env:VCPKG_COMMIT
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg fetch failed' }
          git -C $root checkout --detach FETCH_HEAD
          & "$root/bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg bootstrap failed' }
          & "$root/vcpkg.exe" install 'libzip[core]:x64-windows' --disable-metrics
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg install failed' }
          "VCPKG_ROOT=$root" >> $env:GITHUB_ENV
          "VCPKG_INSTALLED_DIR=$root/installed" >> $env:GITHUB_ENV
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NSIS install failed' }
      - name: Install pinned Qt SDK
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: ${{ needs.metadata.outputs.qt }}
          host: ${{ matrix.qt_host }}
          arch: ${{ matrix.qt_arch }}
          modules: 'qtmultimedia qtimageformats qtshadertools'
          cache: true
          install-deps: false
          setup-python: false
      - name: Fetch verified PDFium
        run: python tools/ci/dependencies.py '${{ matrix.target }}'
      - name: Configure
        run: python tools/ci/configure.py --target '${{ matrix.target }}' --version "$PACKAGE_VERSION"
      - name: Build
        run: cmake --build build --parallel 3
      - name: Test
        run: |
          set +e
          ctest --test-dir build --output-on-failure --timeout 180
          status=$?
          python -c "from pathlib import Path; [print(p.read_text(encoding='utf-8', errors='replace')) for p in Path('build').glob('*-results.txt')]"
          exit "$status"
      - name: Package
        run: python tools/ci/package.py --target '${{ matrix.target }}' --version "$PACKAGE_VERSION"
      - name: Test relocated packages without SDK paths
        run: python tools/ci/smoke.py --target '${{ matrix.target }}' --version "$PACKAGE_VERSION"
      - name: Upload distributables
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: diagnostics-${{ matrix.target }}
          path: |
            build/Testing/Temporary/
            build/*-results.txt
            build/package-smoke/
            build/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [metadata, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
      PACKAGE_VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: packages-*
          path: release-assets
          merge-multiple: true
      - name: Verify every expected package and checksum
        run: python3 tools/ci/verify_release.py --directory release-assets --version "$PACKAGE_VERSION"
      - name: Publish only after every platform passed
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > /tmp/stacks-is-draft; then
            test "$(cat /tmp/stacks-is-draft)" = true || { echo 'Refusing to overwrite a published release'; exit 1; }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Stacks $PACKAGE_VERSION" --notes-file packaging/RELEASE_NOTES.md
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          if [[ "$PACKAGE_VERSION" == *-* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          fi
